---
# ── TaskFlow: Rolling Deploy Playbook ─────────────────────────────────────────
# Called by GitHub Actions for zero-downtime deployments
# Usage: ansible-playbook -i inventory/hosts.ini deploy.yml -e "image_tag=sha-abc123"

- name: "Rolling Deploy — Pull & restart TaskFlow services"
  hosts: webservers
  become: yes
  gather_facts: no
  serial: 1         # Rolling: update one host at a time
  max_fail_percentage: 0   # Stop on any failure

  vars:
    image_tag: "{{ lookup('env', 'IMAGE_TAG') | default('latest') }}"

  tasks:
    - name: Log into GHCR
      docker_login:
        registry: ghcr.io
        username: "{{ github_username }}"
        password: "{{ vault_ghcr_token }}"
      no_log: true

    - name: Update image tags in .env
      lineinfile:
        path: "{{ app_dir }}/.env"
        regexp: "^IMAGE_TAG="
        line: "IMAGE_TAG={{ image_tag }}"

    - name: Pull updated images
      command: docker-compose -f "{{ docker_compose_file }}" pull
      args:
        chdir: "{{ app_dir }}"

    - name: Recreate containers with new images
      community.docker.docker_compose_v2:
        project_src: "{{ app_dir }}"
        recreate: always
        remove_orphans: yes

    - name: Verify backend health after deploy
      uri:
        url: "http://localhost:5000/health"
        status_code: 200
      register: result
      until: result.status == 200
      retries: 10
      delay: 6

    - name: Print deploy summary
      debug:
        msg: "🚀 Deployed image_tag={{ image_tag }} to {{ inventory_hostname }}"
