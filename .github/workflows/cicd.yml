name: "🚀 TaskFlow CI/CD Pipeline"

# ── Triggers ───────────────────────────────────────────────────────────────────
on:
  push:
    branches:
      - main          # Production deploy
      - develop       # Staging deploy
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:   # Manual trigger
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "staging"
        type: choice
        options: [staging, production]

# ── Global env ────────────────────────────────────────────────────────────────
env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE:  ghcr.io/${{ github.repository_owner }}/taskflow-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/taskflow-frontend
  NODE_VERSION: "20"

# ── Cancel duplicate runs on same branch ─────────────────────────────────────
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ─────────────────────────────────────────────────────────────────────────────
jobs:

# ══════════════════════════════════════════════════════════════════════════════
# JOB 1 — Lint & Static Analysis
# ══════════════════════════════════════════════════════════════════════════════
  lint:
    name: "🔍 Lint & Code Quality"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint backend (ESLint)
        working-directory: backend
        run: npx eslint src/ --ext .js --max-warnings 0 || true

      - name: Lint frontend (ESLint)
        working-directory: frontend
        run: npx eslint src/ --ext .jsx,.js --max-warnings 0 || true

      - name: Check for hardcoded secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# ══════════════════════════════════════════════════════════════════════════════
# JOB 2 — Backend Tests
# ══════════════════════════════════════════════════════════════════════════════
  test-backend:
    name: "🧪 Backend Tests"
    runs-on: ubuntu-latest
    needs: lint

    # Spin up PostgreSQL service container for integration tests
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: taskflow_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: taskflow_test
      DB_USER: postgres
      DB_PASSWORD: postgres
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Run unit & integration tests with coverage
        working-directory: backend
        run: npm test -- --coverage --coverageReporters=lcov

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: backend/coverage
          flags: backend
          fail_ci_if_error: false

      - name: Archive test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: backend/coverage/

# ══════════════════════════════════════════════════════════════════════════════
# JOB 3 — Frontend Tests & Build
# ══════════════════════════════════════════════════════════════════════════════
  test-frontend:
    name: "🎨 Frontend Build & Test"
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test || true

      - name: Build production bundle
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'http://localhost:5000' }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

# ══════════════════════════════════════════════════════════════════════════════
# JOB 4 — Security Scanning
# ══════════════════════════════════════════════════════════════════════════════
  security-scan:
    name: "🔒 Security Scan"
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    permissions:
      security-events: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner (filesystem)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      - name: Audit backend npm dependencies
        working-directory: backend
        run: npm audit --audit-level=high || true

      - name: Audit frontend npm dependencies
        working-directory: frontend
        run: npm audit --audit-level=high || true

# ══════════════════════════════════════════════════════════════════════════════
# JOB 5 — Build & Push Docker Images
# ══════════════════════════════════════════════════════════════════════════════
  build-push:
    name: "🐳 Build & Push Docker Images"
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend, security-scan]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
      backend_digest: ${{ steps.build-backend.outputs.digest }}
      frontend_digest: ${{ steps.build-frontend.outputs.digest }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (multi-platform builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.BACKEND_IMAGE }}
            ${{ env.FRONTEND_IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build & push backend image
        id: build-backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ steps.meta.outputs.version }}
            ${{ env.BACKEND_IMAGE }}:latest
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
          platforms: linux/amd64,linux/arm64

      - name: Build & push frontend image
        id: build-frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ steps.meta.outputs.version }}
            ${{ env.FRONTEND_IMAGE }}:latest
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          platforms: linux/amd64,linux/arm64

      - name: Scan built images for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.BACKEND_IMAGE }}:${{ steps.meta.outputs.version }}
          format: table
          exit-code: 0
          severity: CRITICAL

# ══════════════════════════════════════════════════════════════════════════════
# JOB 6 — Deploy to Staging
# ══════════════════════════════════════════════════════════════════════════════
  deploy-staging:
    name: "🌿 Deploy → Staging"
    runs-on: ubuntu-latest
    needs: build-push
    if: github.ref == 'refs/heads/develop'
    environment:
      name: staging
      url: https://staging.taskflow.yourdomain.com

    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.STAGING_SSH_KEY }}

      - name: Install Ansible
        run: |
          pip install ansible ansible-lint
          ansible --version

      - name: Write Ansible Vault password
        run: echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > /tmp/.vault_pass

      - name: Write staging inventory
        run: |
          echo "${{ secrets.STAGING_INVENTORY }}" > ansible/inventory/staging.ini

      - name: Deploy to staging via Ansible
        working-directory: ansible
        run: |
          ansible-playbook deploy.yml \
            -i inventory/staging.ini \
            --vault-password-file /tmp/.vault_pass \
            -e "image_tag=${{ needs.build-push.outputs.image_tag }}" \
            -e "env=staging"

      - name: Cleanup vault password
        if: always()
        run: rm -f /tmp/.vault_pass

      - name: Notify Slack — Staging Deploy
        uses: slackapi/slack-github-action@v1.26.0
        if: always()
        with:
          payload: |
            {
              "text": "${{ job.status == 'success' && '✅' || '❌' }} Staging deploy *${{ needs.build-push.outputs.image_tag }}* — ${{ job.status }}",
              "username": "TaskFlow CI/CD"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

# ══════════════════════════════════════════════════════════════════════════════
# JOB 7 — Deploy to Production
# ══════════════════════════════════════════════════════════════════════════════
  deploy-production:
    name: "🚀 Deploy → Production"
    runs-on: ubuntu-latest
    needs: build-push
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://taskflow.yourdomain.com
    # Requires manual approval from GitHub environment protection rules

    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PROD_SSH_KEY }}

      - name: Install Ansible
        run: pip install ansible

      - name: Write Ansible Vault password
        run: echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > /tmp/.vault_pass

      - name: Write production inventory
        run: |
          echo "${{ secrets.PROD_INVENTORY }}" > ansible/inventory/production.ini

      - name: Deploy to production via Ansible (rolling)
        working-directory: ansible
        run: |
          ansible-playbook deploy.yml \
            -i inventory/production.ini \
            --vault-password-file /tmp/.vault_pass \
            -e "image_tag=${{ needs.build-push.outputs.image_tag }}" \
            -e "env=production"

      - name: Cleanup vault password
        if: always()
        run: rm -f /tmp/.vault_pass

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true
          body: |
            ## 🚀 TaskFlow ${{ needs.build-push.outputs.image_tag }}
            ### Docker Images
            - Backend: `${{ env.BACKEND_IMAGE }}:${{ needs.build-push.outputs.image_tag }}`
            - Frontend: `${{ env.FRONTEND_IMAGE }}:${{ needs.build-push.outputs.image_tag }}`

      - name: Notify Slack — Production Deploy
        uses: slackapi/slack-github-action@v1.26.0
        if: always()
        with:
          payload: |
            {
              "text": "${{ job.status == 'success' && '🚀' || '🔥' }} Production deploy *${{ needs.build-push.outputs.image_tag }}* — ${{ job.status }} | ${{ github.event.head_commit.message }}",
              "username": "TaskFlow CI/CD"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
