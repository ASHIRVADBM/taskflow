name: "🔎 PR Validation"

on:
  pull_request:
    branches: [main, develop]

jobs:
  validate:
    name: "Validate PR"
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: taskflow_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: taskflow_test
      DB_USER: postgres
      DB_PASSWORD: postgres
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install all dependencies
        run: |
          cd backend  && npm ci
          cd ../frontend && npm ci

      - name: Run backend tests
        working-directory: backend
        run: npm test

      - name: Build frontend (ensure it compiles)
        working-directory: frontend
        run: npm run build

      - name: Validate Docker Compose syntax
        run: docker compose -f docker-compose.yml config --quiet

      - name: Validate Kubernetes manifests
        run: |
          curl -sLO https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar xzf kubeconform-linux-amd64.tar.gz
          ./kubeconform -strict -summary k8s/

      - name: Comment PR with results
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## PR Validation Results\n- Tests: ${{ job.status }}\n- Build: ✅`
            })
